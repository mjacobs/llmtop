# golangci-lint v2 configuration. `make lint` / `make check` run this; CI pins
# golangci-lint v2.15.0 (see .github/workflows/ci.yml), so use the same version locally to
# match. The standard set (errcheck, govet, ineffassign, staticcheck, unused)
# plus a few cheap extras; gofmt is enforced separately by `make fmt-check`.
version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - unconvert
    - unparam
